# Nightly backup of the Supabase database (the free plan has no backups), plus a daily ping that keeps the free
# project from being paused for inactivity. The dump is encrypted before it leaves the runner: this repository is
# public, so its artifacts can be downloaded by anyone, and only someone with BACKUP_PASSPHRASE can read them.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL     Supabase -> Connect -> "Session pooler" connection string, with your database password
#   BACKUP_PASSPHRASE   a long passphrase you keep somewhere safe (password manager); needed to restore
# Restore steps: docs/backups.md

name: Database backup

on:
  schedule:
    - cron: "17 2 * * *" # every day at 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check the secrets are set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Add the SUPABASE_DB_URL secret (see docs/backups.md)"; exit 1; }
          [ ${#BACKUP_PASSPHRASE} -ge 16 ] || { echo "::error::Add a BACKUP_PASSPHRASE secret of at least 16 characters"; exit 1; }

      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          stamp=$(date -u +%Y-%m-%d)
          # Your data (public) and the user accounts (auth). Supabase's own internal schemas are recreated by Supabase.
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --file=db.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "rja-db-$stamp.dump.gpg" db.dump
          shred -u db.dump
          ls -l "rja-db-$stamp.dump.gpg"
          echo "STAMP=$stamp" >> "$GITHUB_ENV"

      - name: Keep the backup for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: rja-db-${{ env.STAMP }}
          path: rja-db-*.dump.gpg
          retention-days: 90
          if-no-files-found: error

  keep-alive:
    # A daily API request, so Supabase does not pause the free project after a quiet week. The key is the
    # publishable one, already public in the site (lib/public-env.ts).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ping the API
        run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" \
            "https://zdppasosborxodhglqwo.supabase.co/rest/v1/product_categories?select=id&limit=1" \
            -H "apikey: sb_publishable_rh__ErC5aNGhBcG4f5_zKA_sk2SqxV0"
